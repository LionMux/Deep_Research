[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scirag"
version = "0.1.0"
description = "SciRAG — Scientific Iterative Retrieval-Augmented Generation via MCP"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.3.0",
    "faiss-cpu>=1.7.4",
    "networkx>=3.1",
    "mcp>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "black>=23.0.0"]

[project.scripts]
scirag = "scirag.cli:main"

[project.urls]
Homepage = "https://github.com/scirag/scirag"
Repository = "https://github.com/scirag/scirag"
