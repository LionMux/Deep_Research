[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scirag"
version = "2.0.0"
description = "SciRAG — Scientific Iterative Research Agent (outline-guided synthesis with citation-graph reasoning)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "LionMux" }]
keywords = ["rag", "research", "retrieval", "citations", "mcp", "science"]

# Core runtime dependencies (kept in sync with requirements.txt).
dependencies = [
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "sentence-transformers>=3.0.0",
    "transformers>=4.40.0",
    "tokenizers>=0.21.0",
    "faiss-cpu>=1.7.4",
    "networkx>=3.2.0",
    "rank-bm25>=0.2.2",
    "nltk>=3.8.0",
    "regex>=2024.0.0",
    "sentencepiece>=0.2.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
# HTTP API server
api = ["fastapi>=0.111.0", "uvicorn>=0.30.0"]
# Model Context Protocol server (Claude Code / Kimi Code integration)
mcp = ["mcp>=1.0.0"]
# Development / CI tooling
dev = [
    "pytest>=7.4.0",
    "ruff>=0.5.0",
    "black>=24.0.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
scirag = "scirag.cli:main"

[project.urls]
Homepage = "https://github.com/LionMux/Deep_Research"
Repository = "https://github.com/LionMux/Deep_Research"

[tool.setuptools.packages.find]
include = ["scirag*"]
exclude = ["tests*", "third_party*", "papers*", "papers_subset*", "data*", "scirag_data*"]

# ----------------------------------------------------------------------
# Tooling
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"
# third_party/ are vendored upstream repos; do not lint them.
extend-exclude = ["third_party", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E402: several modules intentionally manipulate sys.path / do conditional
#       imports before module-level imports.
# E501: legacy long lines are tolerated (formatting handled by black/ruff format).
ignore = ["E402", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["scirag"]

[tool.black]
line-length = 120
target-version = ["py310"]
extend-exclude = "third_party/"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
